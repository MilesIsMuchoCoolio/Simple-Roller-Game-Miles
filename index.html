<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Peashooters Inferno</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Peashooters Inferno</h1>
  <p id="status" class="status">Initializing...</p>
  <label for="level-select">Choose a level:</label>
  <select id="level-select" aria-label="Choose a level"></select>
  <button id="previous-level" type="button">Previous</button>
  <button id="next-level" type="button">Next</button>
  <p>Move: A/D or arrow keys · Jump: W, Up, or Space · Shoot: mouse click · Reload: R</p>
  <canvas id="game" width="800" height="400"></canvas>
  <p id="score">Loading...</p>
  <p id="message">Loading...</p>
  <script src="js/config.js"></script>
  <script src="js/input.js"></script>
  <script src="js/level.js"></script>
  <script src="js/collide.js"></script>
  <script src="js/player.js"></script>
  <script src="js/combat.js"></script>
  <script src="js/crumble.js"></script>
  <script src="js/draw.js"></script>
  <script src="js/game.js"></script>
  <script src="js/main.js"></script>
  <script>
    document.getElementById("previous-level").onclick = Game.previousLevel;
    document.getElementById("next-level").onclick = Game.nextLevel;
    window.addEventListener("keydown", function (event) {
      if (event.key === "n" || event.key === "N") Game.nextLevel();
    });
  </script>
</body>
</html>
